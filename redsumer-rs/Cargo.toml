[package]
name = "redsumer"
description = "Lightweight stream messaging library for Rust: produce and consume messages with a simple, flexible and reliable API"
version = "0.6.0-alpha.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "../README.md"
keywords = ["redis", "redis_streams"]
homepage = "https://github.com/enerBit/redsumer-rs"
repository = "https://github.com/enerBit/redsumer-rs"
documentation = "https://docs.rs/redsumer"
categories = ["database", "api-bindings", "network-programming"]
authors = ["Juan Manuel Tamayo <jmtamayog23@gmail.com>"]

[dependencies]
redis = { version = "1.3", default-features = false, features = ["streams"] }
tracing = { version = ">=0.1.40" }

[dev-dependencies]
redis-test = "1.0.4"
